name: Whirlpool / KitchenAid / Maytag / JennAir Appliances
type: Hardmod
difficulty: Intermediate
firmware: "1.0 - 2.0"
reversible: true
brick: unlikely
tools:
- ESP32 or ESP8266 development board
- 3-pin JST / Molex connector cable (for the WIDE bus port)
- Buck converter (12V to 5V/3.3V)
- PC or Mac (running ESPHome)
guide: https://github.com/nicola-lunghi/esphome-whirlpool
cfw: https://github.com/esphome/esphome
image:
notes: "Taps into the internal 3-wire WIDE serial bus found on modern Whirlpool-family washers, dryers, ovens, and dishwashers to read cycle telemetry and control settings locally in Home Assistant without the Whirlpool cloud."
