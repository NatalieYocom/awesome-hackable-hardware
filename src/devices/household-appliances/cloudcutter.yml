name: Smart Life / Tuya Wi-Fi Devices (ESP8266 / BK7231)
type: Softmod
difficulty: Intermediate
firmware: "1.0.0 - 2.9.0"
reversible: false
brick: unlikely
tools:
- Linux PC or Raspberry Pi with a Wi-Fi adapter
- Secondary smartphone or laptop (to join the dummy AP)
guide: https://github.com/tuya-cloudcutter/tuya-cloudcutter
cfw: https://github.com/arendst/Tasmota
image:
notes: "Uses pre-built tuya-cloudcutter profiles and existing Tasmota/OpenBeken firmware images to flash Tuya-based devices (like HoneyGuaridan or Petlibro Wi-Fi pet feeders) over the air with images that allow full local control."
