name: Gaggia Classic / Classic Pro Espresso Machine
type: Hardmod
difficulty: Difficult
firmware: "1.0.0 - 4.0.0"
reversible: true
brick: unlikely
tools:
- STM32 / ESP32 microcontroller board (Gaggiuino kit)
- Pressure transducer, thermocouple, and dimmer/SSR modules
- High-temperature silicone wire and spade connectors
- Soldering iron and crimping tool
- Phillips screwdriver and hex keys
guide: https://gaggiuino.github.io/
cfw: https://github.com/Zer0-bit/gaggiuino
image:
notes: "Replaces the analog thermostat control with a touchscreen and microcontroller, adding PID temperature control, real-time pressure profiling, flow control, and predictive scale integration."
