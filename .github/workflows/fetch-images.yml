name: Fetch Device Images

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
    paths:
      - 'src/devices/**/*.yml'
      - 'scripts/fetch_images.py'
  workflow_dispatch: # Adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  fetch-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch missing device images
        run: python scripts/fetch_images.py

      - name: Commit and push downloaded images
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/images/ src/devices/
          git diff --staged --quiet || (git commit -m "chore: auto-fetch missing device images" && git push)
